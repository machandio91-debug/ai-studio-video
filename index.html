
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Studio Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b14;color:#fff;font-family:Arial,sans-serif}
header{padding:20px 6%;border-bottom:1px solid #25283b}
.logo{font-size:25px;font-weight:bold;color:#a78bfa}
main{max-width:850px;margin:55px auto;padding:20px}
h1{text-align:center;font-size:38px}
.sub{text-align:center;color:#a5a5b5}
.panel{background:#151827;padding:24px;border:1px solid #30344b;border-radius:18px;margin-top:35px}
label{display:block;margin:15px 0 8px}
textarea,select{width:100%;padding:15px;border-radius:10px;background:#0d1020;color:white;border:1px solid #383c55;font-size:16px}
textarea{height:130px;resize:vertical}
.options{display:grid;grid-template-columns:1fr 1fr;gap:15px}
button{width:100%;padding:16px;margin-top:22px;background:linear-gradient(90deg,#7657ed,#a855f7);border:0;border-radius:10px;color:white;font-weight:bold;font-size:17px}
button:disabled{opacity:.5}
#status{color:#c4b5fd;text-align:center;margin-top:20px}
#preview{width:100%;margin-top:20px;border-radius:12px}
footer{text-align:center;color:#888;padding:30px}
</style>
</head>
<body>
<header><div class="logo">✦ AI STUDIO VIDEO</div></header>
<main>
<h1>Turn Your Imagination Into Video</h1>
<p class="sub">Create cinematic AI videos from simple text prompts.</p>
<div class="panel">
<label>Describe your video</label>
<textarea id="prompt" placeholder="A cinematic drone shot of a futuristic city at sunset..."></textarea>
<div class="options">
<div>
<label>Aspect Ratio</label>
<select id="ratio">
<option value="16:9">Landscape 16:9</option>
<option value="9:16">Portrait 9:16</option>
</select>
</div>
<div>
<label>Quality</label>
<select id="quality">
<option value="480p">480p</option>
</select>
</div>
</div>
<button id="generate" onclick="generateVideo()">Generate Video ✨</button>
<p id="status">Ready to create your video.</p>
<video id="preview" controls hidden></video>
</div>
</main>
<footer>AI STUDIO VIDEO · Powered by AI</footer>
<script>
async function generateVideo(){
 const prompt=document.getElementById('prompt').value.trim();
 const status=document.getElementById('status');
 if(!prompt){status.textContent="Please enter a video prompt.";return;}
 status.textContent="Video engine is not connected yet. Backend setup is coming next.";
}
</script>
</body>
</html>
